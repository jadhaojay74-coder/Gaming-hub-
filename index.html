<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAME HUB - Play Simple 2D Games</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2">
        <rect x="2" y="6" width="20" height="12" rx="4"/>
        <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>
      </svg>
      <span>GAME <span class="brand-purple">HUB</span></span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="active">Home</a></li>
      <li><a href="#popular">Games</a></li>
      <li>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          🌙
        </button>
      </li>
    </ul>
  </header>

  <section class="hero">
    <div class="hero-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5">
        <rect x="2" y="6" width="20" height="12" rx="4"/>
        <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>
      </svg>
    </div>
    <h1>GAME <span>HUB</span></h1>
    <p>Play simple 2D games. Have fun!</p>
    <button class="btn-primary" id="browseBtn">
      ▶ BROWSE GAMES
    </button>
  </section>

  <main class="container" id="popular">
    <h2 class="section-title">Popular Games</h2>
    <div class="games-grid">

      <div class="game-card">
        <div class="card-thumbnail bg-snake">
          <svg width="50" height="50" viewBox="0 0 100 100">
            <path d="M 20 20 H 80 V 50 H 50 V 80 H 20" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
            <circle cx="80" cy="80" r="8" fill="#ef4444"/>
          </svg>
        </div>
        <div class="game-title">Snake</div>
        <button class="btn-play" data-game="snake">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-pong">
          <svg width="50" height="50" viewBox="0 0 100 100">
            <rect x="15" y="30" width="8" height="40" rx="4" fill="#3b82f6"/>
            <rect x="77" y="30" width="8" height="40" rx="4" fill="#ef4444"/>
            <circle cx="50" cy="50" r="6" fill="#ffffff"/>
          </svg>
        </div>
        <div class="game-title">Pong</div>
        <button class="btn-play" data-game="pong">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-2048">
          <div class="mini-grid">
            <span class="t-2">2</span><span class="t-4">4</span>
            <span class="t-8">8</span><span class="t-16">16</span>
          </div>
        </div>
        <div class="game-title">2048</div>
        <button class="btn-play" data-game="2048">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-sudoku">
          <div class="sudoku-preview">
            <span>5</span><span>3</span><span>1</span>
            <span>6</span><span></span><span>9</span>
            <span>7</span><span>2</span><span>8</span>
          </div>
        </div>
        <div class="game-title">Sudoku</div>
        <button class="btn-play" data-game="sudoku">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-breakout">
          <svg width="50" height="50" viewBox="0 0 100 100">
            <rect x="10" y="10" width="24" height="10" fill="#ef4444" rx="2"/>
            <rect x="38" y="10" width="24" height="10" fill="#eab308" rx="2"/>
            <rect x="66" y="10" width="24" height="10" fill="#22c55e" rx="2"/>
            <rect x="10" y="24" width="24" height="10" fill="#3b82f6" rx="2"/>
            <rect x="38" y="24" width="24" height="10" fill="#a855f7" rx="2"/>
            <rect x="66" y="24" width="24" height="10" fill="#ef4444" rx="2"/>
            <circle cx="50" cy="55" r="5" fill="#ffffff"/>
            <rect x="30" y="80" width="40" height="8" fill="#3b82f6" rx="4"/>
          </svg>
        </div>
        <div class="game-title">Breakout</div>
        <button class="btn-play" data-game="breakout">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-chess">
          <span style="font-size:2.5rem;">♚ ♘</span>
        </div>
        <div class="game-title">Chess</div>
        <button class="btn-play" data-game="chess">Play</button>
      </div>

    </div>
  </main>

  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Game</span>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="game-area" id="gameArea"></div>
    </div>
  </div>

  <footer>
    © 2024 Game Hub. All rights reserved.
  </footer>

  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
