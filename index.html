<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub - Play 10 Games</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      <span>GAME <span class="brand-purple">HUB</span></span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="active">Home</a></li>
      <li>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </li>
    </ul>
  </header>

  <section class="hero">
    <svg class="hero-icon" viewBox="0 0 24 24">
      <path d="M6 11h4M8 9v4m7-3h.01M18 12h.01M21 6H3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/>
    </svg>
    <h1>GAME <span>HUB</span></h1>
    <p>Play simple 2D games instantly in your browser!</p>
    <button class="btn-primary" id="browseBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      BROWSE GAMES
    </button>
  </section>

  <main class="container">
    <h2 class="section-title">Popular Games</h2>
    <div class="games-grid">

      <div class="game-card">
        <div class="card-thumbnail bg-ttt">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <path d="M35 15V85 M65 15V85 M15 35H85 M15 65H85" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
            <path d="M20 20L30 30 M30 20L20 30" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="6" fill="none" stroke="#ef4444" stroke-width="4"/>
          </svg>
        </div>
        <div class="game-title">Tic-Tac-Toe</div>
        <button class="btn-secondary" data-game="ttt">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-snake">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <path d="M 20 20 H 80 V 50 H 50 V 80 H 20" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="80" cy="80" r="8" fill="#ef4444"/>
          </svg>
        </div>
        <div class="game-title">Snake</div>
        <button class="btn-secondary" data-game="snake">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-pong">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <rect x="15" y="30" width="8" height="40" rx="4" fill="#3b82f6"/>
            <rect x="77" y="35" width="8" height="40" rx="4" fill="#ef4444"/>
            <circle cx="50" cy="50" r="6" fill="#ffffff"/>
          </svg>
        </div>
        <div class="game-title">Pong</div>
        <button class="btn-secondary" data-game="pong">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-reaction">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="35" fill="#f59e0b"/>
            <circle cx="50" cy="50" r="23" fill="#fef3c7"/>
            <circle cx="50" cy="50" r="11" fill="#ef4444"/>
          </svg>
        </div>
        <div class="game-title">Reaction Test</div>
        <button class="btn-secondary" data-game="reaction">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-clicker">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <path d="M35 20L65 50L50 53L60 75L50 80L40 58L25 65Z" fill="#6366f1" stroke="#4338ca" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="game-title">Clicker</div>
        <button class="btn-secondary" data-game="clicker">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-memory">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <rect x="15" y="20" width="30" height="45" rx="5" fill="#a855f7"/>
            <rect x="55" y="35" width="30" height="45" rx="5" fill="#c084fc"/>
            <path d="M25 42L35 42 M30 37L30 47" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="game-title">Memory Match</div>
        <button class="btn-secondary" data-game="memory">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-guess">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <rect x="20" y="20" width="60" height="60" rx="10" fill="#0284c7"/>
            <text x="50" y="62" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
          </svg>
        </div>
        <div class="game-title">Guess the Number</div>
        <button class="btn-secondary" data-game="guess">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-puzzle">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <rect x="15" y="15" width="32" height="32" rx="4" fill="#ea580c"/>
            <text x="31" y="38" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
            <rect x="53" y="15" width="32" height="32" rx="4" fill="#ea580c"/>
            <text x="69" y="38" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
            <rect x="15" y="53" width="32" height="32" rx="4" fill="#ea580c"/>
            <text x="31" y="76" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
            <rect x="53" y="53" width="32" height="32" rx="4" fill="#ffedd5" stroke="#fdba74" stroke-width="2" stroke-dasharray="4"/>
          </svg>
        </div>
        <div class="game-title">Sliding Puzzle</div>
        <button class="btn-secondary" data-game="puzzle">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-connect">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <rect x="10" y="20" width="80" height="60" rx="6" fill="#2563eb"/>
            <circle cx="28" cy="38" r="8" fill="#ef4444"/>
            <circle cx="50" cy="38" r="8" fill="#eab308"/>
            <circle cx="72" cy="38" r="8" fill="#ffffff"/>
            <circle cx="28" cy="62" r="8" fill="#eab308"/>
            <circle cx="50" cy="62" r="8" fill="#ef4444"/>
            <circle cx="72" cy="62" r="8" fill="#ef4444"/>
          </svg>
        </div>
        <div class="game-title">Connect Four</div>
        <button class="btn-secondary" data-game="connect">Play</button>
      </div>

      <div class="game-card">
        <div class="card-thumbnail bg-rps">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <circle cx="30" cy="35" r="14" fill="#64748b"/>
            <rect x="52" y="22" width="22" height="26" rx="4" fill="#94a3b8"/>
            <path d="M35 72L50 50 M65 72L50 50" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="6" fill="#0f172a"/>
          </svg>
        </div>
        <div class="game-title">Rock Paper Scissors</div>
        <button class="btn-secondary" data-game="rps">Play</button>
      </div>

    </div>
  </main>

  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Game Title</span>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="game-area" id="gameArea"></div>
    </div>
  </div>

  <footer>
    © 2024 Game Hub. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
    </html>
